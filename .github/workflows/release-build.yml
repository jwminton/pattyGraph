name: Release Build

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build Release Archives
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: cmd/pattyView/package-lock.json

      - name: Build release archives
        run: ./compile.sh

      - name: Upload Linux amd64 archive
        uses: actions/upload-artifact@v7
        with:
          name: pattyGraph-linux-amd64
          path: dist/linux-amd64/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux arm64 archive
        uses: actions/upload-artifact@v7
        with:
          name: pattyGraph-linux-arm64
          path: dist/linux-arm64/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload archives to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/linux-amd64/*.tar.gz \
            dist/linux-arm64/*.tar.gz \
            --clobber
